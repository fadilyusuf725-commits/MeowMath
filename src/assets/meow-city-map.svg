<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Peta dekoratif Kota Meow</title>
  <desc id="desc">Peta kota ceria dengan jalan berkelok, tiga bangunan berbentuk kubus dan balok, pohon, bintang, dan kompas jejak kaki kucing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6F9F5"/>
      <stop offset="1" stop-color="#FDF8DD"/>
    </linearGradient>
    <filter id="cityShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#21475B" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="560" height="300" rx="28" fill="url(#sky)"/>
  <path d="M0 245c95-36 177-19 264 13 97 36 184 22 296-27v69H0Z" fill="#B9E4C7"/>
  <path d="M-12 251c79-59 138-22 182-61 48-43 91-83 142-52 43 25 46 66 101 54 47-10 70-52 159-32" fill="none" stroke="#FFFDF3" stroke-width="29" stroke-linecap="round"/>
  <path d="M-12 251c79-59 138-22 182-61 48-43 91-83 142-52 43 25 46 66 101 54 47-10 70-52 159-32" fill="none" stroke="#E2BC87" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- grid area for a learning map -->
  <g transform="translate(346 36)">
    <rect x="0" y="0" width="156" height="116" rx="16" fill="#E9FAF5" stroke="#38A9A4" stroke-width="4"/>
    <path d="M31 0v116M62 0v116M93 0v116M124 0v116M0 29h156M0 58h156M0 87h156" stroke="#A4DCCE" stroke-width="2"/>
    <circle cx="77" cy="44" r="10" fill="#F58A45" stroke="#21475B" stroke-width="3"/>
    <path d="m77 25 5 13 14 1-11 9 4 14-12-8-12 8 4-14-11-9 14-1Z" fill="#FFD24D" stroke="#21475B" stroke-width="2" stroke-linejoin="round"/>
    <text x="12" y="20" fill="#287B94" font-family="Arial, sans-serif" font-size="12" font-weight="700">PETA KOTA</text>
  </g>

  <!-- cube house -->
  <g transform="translate(64 115)" filter="url(#cityShadow)">
    <path d="m55 0 53 30-53 31L2 30Z" fill="#FFD24D" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M2 30l53 31v63L2 93Z" fill="#46BBC2" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <path d="m55 61 53-31v63l-53 31Z" fill="#F58A45" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <rect x="20" y="71" width="19" height="27" rx="4" fill="#FFF8DB" stroke="#21475B" stroke-width="3"/>
    <path d="M72 77h18v18H72Z" fill="#DDF8FF" stroke="#21475B" stroke-width="3"/>
  </g>

  <!-- rectangular building -->
  <g transform="translate(201 141)" filter="url(#cityShadow)">
    <path d="m45 0 84 24-45 25L0 25Z" fill="#FFDA58" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 25l84 24v50L0 75Z" fill="#71CAD0" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <path d="m84 49 45-25v50L84 99Z" fill="#F28B5D" stroke="#21475B" stroke-width="4" stroke-linejoin="round"/>
    <path d="M19 47h19v15H19ZM48 56h19v15H48Z" fill="#FFF8DB" stroke="#21475B" stroke-width="3"/>
  </g>

  <!-- trees -->
  <g stroke="#21475B" stroke-width="3" stroke-linejoin="round">
    <path d="M313 221v34" stroke="#8A5A3B" stroke-width="8" stroke-linecap="round"/>
    <path d="m313 176 23 31h-15l18 22h-52l18-22h-15Z" fill="#62C38B"/>
    <path d="M521 178v37" stroke="#8A5A3B" stroke-width="8" stroke-linecap="round"/>
    <path d="m521 133 24 32h-15l18 22h-54l18-22h-15Z" fill="#62C38B"/>
  </g>

  <!-- cat-paw compass -->
  <g transform="translate(451 196)" filter="url(#cityShadow)">
    <circle cx="44" cy="44" r="40" fill="#FFF8DB" stroke="#21475B" stroke-width="4"/>
    <path d="M44 12v16M44 60v16M12 44h16M60 44h16" stroke="#38A9A4" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="44" cy="51" rx="14" ry="11" fill="#F58A45"/>
    <ellipse cx="26" cy="35" rx="7" ry="9" transform="rotate(-28 26 35)" fill="#F58A45"/>
    <ellipse cx="40" cy="28" rx="7" ry="9" transform="rotate(-8 40 28)" fill="#F58A45"/>
    <ellipse cx="54" cy="29" rx="7" ry="9" transform="rotate(10 54 29)" fill="#F58A45"/>
    <ellipse cx="66" cy="38" rx="7" ry="9" transform="rotate(31 66 38)" fill="#F58A45"/>
  </g>

  <path d="m35 49 5 11 12 1-9 8 3 12-11-6-11 6 3-12-9-8 12-1Z" fill="#FFD24D"/>
  <circle cx="294" cy="45" r="9" fill="#F58F91"/>
  <path d="M275 75c10-10 20-10 30 0" fill="none" stroke="#F58F91" stroke-width="5" stroke-linecap="round"/>
</svg>
